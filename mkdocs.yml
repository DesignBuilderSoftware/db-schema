site_name: DesignBuilder Schema
site_description: Python models and element reference for DesignBuilder's dsbXML file format
site_url: https://designbuildersoftware.github.io/db-schema/
repo_url: https://github.com/DesignBuilderSoftware/db-schema
repo_name: DesignBuilderSoftware/db-schema
docs_dir: docs_src
site_dir: docs

# Builds docs_src/schema/elements.md from dsbxml/DesignBuilder.xsd.
hooks:
  - scripts/docs_xsd_reference.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_bases: true
            members_order: source
            show_root_heading: true
            show_if_no_docstring: true

nav:
  - Home:
    - Overview: index.md
    - Examples: examples.md
  - User guide:
    - Introduction: guide/index.md
    - Loading and saving: guide/loading-and-saving.md
    - Model structure: guide/model-structure.md
    - Attributes: guide/attributes.md
    - Geometry: guide/geometry.md
    - Tables: guide/tables.md
    - HVAC: guide/hvac.md
    - Validating against the schema: guide/validation.md
    - Comparing two models: guide/comparing-models.md
    - Errors: guide/errors.md
    - Handles: guide/handles.md
    - Package imports: guide/package-imports.md
  - Schema reference:
    - Elements: schema/elements.md
  - API reference:
    - Overview: api/overview.md
    - Core models: api/models.md
    - HVAC models: api/hvac.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
