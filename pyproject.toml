[project]
name = "designbuilder_schema"
version = "1.0.0"
description = "Python package for DesignBuilder XML files with read / edit / write functionality."
requires-python = ">=3.10"
authors = [
    { name = "Bartlomiej Tokarzewski", email = "bartlomiej.tokarzewski@gmail.com" },
]
dependencies = [
    "pydantic",
    "pydantic-xml",
]

readme = "README.md"

[project.urls]
Homepage = "https://github.com/tokarzewski/designbuilder_schema"
"Bug Tracker" = "https://github.com/tokarzewski/designbuilder_schema/issues"

[tool.setuptools]
packages = ["designbuilder_schema", "designbuilder_schema.hvac"]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy", "xmlschema", "lxml"]
visualise = ["matplotlib"]
tables = ["pandas"]
all = ["pytest", "black", "mypy", "xmlschema", "lxml", "matplotlib", "pandas"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["designbuilder_schema/tests"]

[tool.coverage.run]
source = ["designbuilder_schema"]

[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", "docs", "build", "dist"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
exclude = ["build/", "dist/"]