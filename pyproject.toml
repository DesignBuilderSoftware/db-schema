[project]
name = "designbuilder_schema"
version = "1.0.4"
description = "Python package for DesignBuilder XML files with read / edit / write functionality."
requires-python = ">=3.10"
authors = [
    { name = "Bartlomiej Tokarzewski", email = "bartlomiej.tokarzewski@gmail.com" },
]
dependencies = [
    "pydantic",
    "pydantic-xml",
    "lxml",
]

readme = "README.md"

[project.urls]
Homepage = "https://github.com/tokarzewski/designbuilder_schema"
"Bug Tracker" = "https://github.com/tokarzewski/designbuilder_schema/issues"

[tool.setuptools]
packages = ["db_schema", "db_schema.hvac"]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.12.11,<0.13", "pylint>=3.0.3", "pre-commit>=3.6.1", "xmlschema", "lxml", "mkdocs>=1.5.0", "mkdocs-material>=9.0.0", "mkdocstrings[python]>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["db_schema/tests"]

[tool.coverage.run]
source = ["db_schema"]

[tool.ruff]
line-length = 96
target-version = "py310"
# Lint/format only the package; apps/examples/scripts are auxiliary and
# out of scope for this migration. force-exclude applies these even when
# files are passed explicitly (e.g. by pre-commit).
extend-exclude = ["apps", "examples", "scripts"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["db_schema"]

[tool.ruff.lint.per-file-ignores]
# These HVAC component models reference classes that are injected into the
# module namespace at model_rebuild() time via __init__.py (to avoid circular
# imports), so ruff cannot resolve the forward references statically.
"db_schema/hvac/components.py" = ["F821"]

[tool.pylint.main]
extension-pkg-allow-list = ["lxml"]

[tool.pylint."messages control"]
disable = [
    "C0301", # line-too-long (enforced by ruff at line-length 96)
    "C0114", # missing-module-docstring
    "C0115", # missing-class-docstring (schema element models are self-describing)
    "C0116", # missing-function-docstring
    "C0103", # invalid-name (intentional XML-derived names, e.g. dsbXML)
    "C0414", # useless-import-alias (explicit re-exports in __init__)
    "C0415", # import-outside-toplevel (lazy loading is core to this package)
    "W0108", # unnecessary-lambda
    "W0603", # global-statement (module-level caches/counters by design)
    "R0401", # cyclic-import (managed via lazy model_rebuild injection)
    "R0801", # duplicate-code (noisy across similar schema models)
    "R0903", # too-few-public-methods (noise on pydantic model classes)
]